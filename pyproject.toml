[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chainsim"
version = "0.0.1"
description = "An open-source supply chain simulation framework built for AI/ML workflows: arbitrary network simulation, a Gymnasium RL interface, forecasting benchmarks, disruption modeling, and visualization in one package."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "chainsim contributors" },
]
keywords = [
    "supply-chain",
    "simulation",
    "discrete-event-simulation",
    "reinforcement-learning",
    "gymnasium",
    "operations-research",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]

dependencies = [
    "simpy>=4.1",
    "networkx>=3.2",
    "numpy>=1.26",
    "gymnasium>=0.29",
    "pydantic>=2.5",
]

[project.optional-dependencies]
opt = [
    "ortools>=9.9",
]
dashboard = [
    "streamlit>=1.32",
    "plotly>=5.19",
    "pyvis>=0.3",
]
rl = [
    "stable-baselines3>=2.2",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/chainsim/chainsim"
Repository = "https://github.com/chainsim/chainsim"
Issues = "https://github.com/chainsim/chainsim/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/chainsim"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "examples", "dashboard"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "N",   # pep8-naming
    "SIM", # flake8-simplify
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["chainsim"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
